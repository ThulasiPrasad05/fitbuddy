<!DOCTYPE html>
<html>
<head>
<title>Goals</title>

<style>
body { font-family: Arial; padding: 20px; }

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

.btn {
  padding: 15px;
  border: 1px solid #ccc;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
}

.selected {
  background: black;
  color: white;
}

button {
  margin-top: 20px;
  width: 100%;
  padding: 15px;
}
</style>
</head>

<body>

<h2>What are your goals?</h2>

<div class="grid" id="goals"></div>

<button onclick="next()">Continue</button>

<script>
const options = [
"Weight Loss","Muscle Gain","Endurance",
"Fitness","Powerlifting","Yoga","Crossfit","Bodybuilding"
];

let selected = [];

const container = document.getElementById("goals");

options.forEach(goal => {
  const div = document.createElement("div");
  div.className = "btn";
  div.innerText = goal;

  div.onclick = () => {
    div.classList.toggle("selected");

    if (selected.includes(goal)) {
      selected = selected.filter(g => g !== goal);
    } else {
      selected.push(goal);
    }
  };

  container.appendChild(div);
});

function next() {
  localStorage.setItem("goals", JSON.stringify(selected));
  window.location.href = "plan.html";
}
</script>

</body>
</html>
