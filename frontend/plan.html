<!DOCTYPE html>
<html>
<head>
<title>Workout Plan</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f5f5f5;
}

textarea {
  width: 100%;
  height: 150px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-size: 14px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 15px;
  background: black;
  color: white;
  margin-top: 20px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #333;
}
</style>
</head>

<body>

<h2>Your Workout Plan</h2>
<p>Describe your routine or what you're looking for</p>

<textarea
  id="plan"
  placeholder="e.g. Push Pull Legs 5 days a week..."
></textarea>

<button onclick="finish()">Complete Profile</button>

<script>
async function finish() {

  const currentUser = JSON.parse(localStorage.getItem("user"));
  const profile1 = JSON.parse(localStorage.getItem("profile1"));
  const goals = JSON.parse(localStorage.getItem("goals"));
  const plan = document.getElementById("plan").value;

  if (!currentUser) {
    alert("User not found. Please login again.");
    return;
  }

  if (!profile1) {
    alert("Profile information not found. Please go back and complete your details.");
    return;
  }

  if (!goals || goals.length === 0) {
    alert("Please select at least one goal.");
    return;
  }

  if (!plan.trim()) {
    alert("Please enter your workout plan.");
    return;
  }

  try {

    const response = await fetch(
      `http://localhost:5000/api/users/onboarding/${currentUser._id}`,
      {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          age: profile1.age,
          gender: profile1.gender,
          location: profile1.location,
          workoutType: profile1.workoutType,
          goals: goals,
          plan: plan
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      console.log("Server error:", data);

      alert(
        data.message ||
        data.error ||
        "Unable to save profile"
      );

      return;
    }

    // Update localStorage with the completed user
    if (data.user) {
      localStorage.setItem("user", JSON.stringify(data.user));
    }

    alert("Profile completed ✅");

    // Go to home page
    window.location.href = "home.html";

  } catch (err) {

    console.log("Onboarding error:", err);

    alert(
      "Cannot connect to server. Please make sure the backend is running."
    );
  }
}
</script>

</body>
</html>
