<!DOCTYPE html>
<html>
<head>
  <title>FitBuddy Chat</title>
  <style>
    body {
      display: flex;
      margin: 0;
      font-family: Arial;
      height: 100vh;
    }

    #users {
      width: 30%;
      border-right: 1px solid #ccc;
      padding: 10px;
      background: #f5f5f5;
    }

    #chat {
      width: 70%;
      display: flex;
      flex-direction: column;
    }

    #chatHeader {
      padding: 15px;
      background: #075e54;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #profilePic {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    #messages {
      flex: 1;
      list-style: none;
      padding: 10px;
      overflow-y: auto;
      background: #e5ddd5;
    }

    .message {
      max-width: 60%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 10px;
      clear: both;
    }

    .sent {
      background: #dcf8c6;
      float: right;
    }

    .received {
      background: white;
      float: left;
    }

    #inputArea {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ccc;
    }

    #messageInput {
      flex: 1;
      padding: 10px;
    }

    button {
      padding: 10px;
      background: #075e54;
      color: white;
      border: none;
      cursor: pointer;
    }

    li {
      cursor: pointer;
      margin: 5px 0;
    }
  </style>
</head>

<body>

  <!-- USERS -->
  <div id="users">
    <h3>Matched Users 💘</h3>
    <ul id="userList"></ul>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <div id="chatHeader">
      <img id="profilePic" src="">
      <div>
        <div id="chatName">Select a user</div>
        <small id="statusText"></small>
      </div>
    </div>

    <ul id="messages"></ul>

    <div id="inputArea">
      <input id="messageInput" placeholder="Type message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="http://localhost:5000/socket.io/socket.io.js"></script>

  <script>
    const socket = io("http://localhost:5000");

    const currentUser = JSON.parse(localStorage.getItem("user"));

    if (!currentUser) {
      alert("Login first");
      window.location.href = "login.html";
    }

    const senderId = currentUser._id;

    let receiverId = null;
    let room = null;

    const userList = document.getElementById("userList");
    const messagesList = document.getElementById("messages");
    const chatName = document.getElementById("chatName");
    const statusText = document.getElementById("statusText");
    const profilePic = document.getElementById("profilePic");

    // 🟢 ONLINE STATUS
    socket.emit("user_online", senderId);

    socket.on("online_users", (users) => {
      if (receiverId && users.includes(receiverId)) {
        statusText.textContent = "Online 🟢";
      } else if (receiverId) {
        statusText.textContent = "Last seen recently 🕒";
      }
    });

    // 👥 LOAD USERS
    async function loadUsers() {
      const res = await fetch(`http://localhost:5000/api/users/matches/${senderId}`);
      const data = await res.json();

      userList.innerHTML = "";

      data.matches.forEach(match => {
        const user = match.users.find(u => u._id !== senderId);

        const li = document.createElement("li");
        li.textContent = user.name;
        li.onclick = () => selectUser(user);

        userList.appendChild(li);
      });
    }

    loadUsers();

    function selectUser(user) {
      receiverId = user._id;
      room = [senderId, receiverId].sort().join("_");

      socket.emit("join_room", room);

      chatName.textContent = user.name;
      profilePic.src = user.profilePic || "https://i.pravatar.cc/150";
      statusText.textContent = "Offline";

      messagesList.innerHTML = "";

      loadMessages();
    }

    async function loadMessages() {
      if (!receiverId) return;

      const res = await fetch(`http://localhost:5000/api/users/messages/${senderId}/${receiverId}`);
      const data = await res.json();

      messagesList.innerHTML = "";

      data.messages.forEach(msg => {
        addMessage(msg.sender === senderId, msg.text);
      });
    }

    function addMessage(isSender, text) {
      const li = document.createElement("li");
      li.classList.add("message");
      li.classList.add(isSender ? "sent" : "received");
      li.textContent = text;
      messagesList.appendChild(li);

      messagesList.scrollTop = messagesList.scrollHeight;
    }

    // 📩 RECEIVE
    socket.on("receive_message", (data) => {
      if (data.room === room && data.sender !== senderId) {
        addMessage(false, data.text);
      }
    });

    // ⌨️ TYPING
    let typingTimeout;

    document.getElementById("messageInput").addEventListener("input", () => {
      socket.emit("typing", { room, sender: senderId });

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit("stop_typing", { room });
      }, 1000);
    });

    socket.on("typing", () => {
      statusText.textContent = "Typing...";
    });

    socket.on("stop_typing", () => {
      statusText.textContent = "Online 🟢";
    });

    // 📤 SEND
    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text || !receiverId) return;

      await fetch("http://localhost:5000/api/users/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          senderId,
          receiverId,
          text
        })
      });

      socket.emit("send_message", {
        room,
        sender: senderId,
        text
      });

      addMessage(true, text);

      input.value = "";
    }
  </script>

</body>
</html>
